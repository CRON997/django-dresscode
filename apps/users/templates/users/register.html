{%extends "main/base.html"%}
{%load static%}

{%block title%}Registration{%endblock%}

{%block link%}
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'users/css/register.css' %}">
{%endblock%}

{%block content%}
<div class="wrapper">
    <form id="registration-form" action="#" method="POST">
        {%csrf_token%}
        <h1>Registration</h1>
        <div id="error-message" class="error-message">{{form.errors}}</div>
        <div class="grid">
            {%for field in form%}
            <div class="input-box">
                {{field.as_field_group}}
            </div>
            {%endfor%}
        </div>
        <div>
            <button type="submit" class="btn">Create an Account</button>
        </div>
        <div class="link-auth">
            <a href="{%url 'users:login'%}">Already have an account? Authorize</a>
        </div>
    </form>

</div>
{%endblock%}
